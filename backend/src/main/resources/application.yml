spring:
  application:
    name: linkcart-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s
  datasource:
    url: ${LINKCART_DB_URL}
    username: ${LINKCART_DB_USERNAME}
    password: ${LINKCART_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

linkcart:
  coupang:
    access-key: ${LINKCART_COUPANG_ACCESS_KEY:}
    secret-key: ${LINKCART_COUPANG_SECRET_KEY:}
    base-url: ${LINKCART_COUPANG_BASE_URL:https://api-gateway.coupang.com}
  elevenst:
    api-key: ${LINKCART_ELEVENST_API_KEY:}
    base-url: ${LINKCART_ELEVENST_BASE_URL:https://openapi.11st.co.kr/openapi}
  google:
    client-id: ${LINKCART_GOOGLE_CLIENT_ID}
    client-secret: ${LINKCART_GOOGLE_CLIENT_SECRET}
    token-url: ${LINKCART_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
  jwt:
    secret: ${LINKCART_JWT_SECRET}
    access-token-ttl-seconds: ${LINKCART_JWT_ACCESS_TTL:900}
    issuer: linkcart
    audience: linkcart-api
