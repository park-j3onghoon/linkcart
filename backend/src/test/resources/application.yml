spring:
  application:
    name: linkcart-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s
  datasource:
    url: jdbc:h2:mem:linkcart_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

linkcart:
  coupang:
    access-key: ${LINKCART_COUPANG_ACCESS_KEY:}
    secret-key: ${LINKCART_COUPANG_SECRET_KEY:}
    base-url: ${LINKCART_COUPANG_BASE_URL:https://api-gateway.coupang.com}
  elevenst:
    api-key: ${LINKCART_ELEVENST_API_KEY:}
    base-url: ${LINKCART_ELEVENST_BASE_URL:https://openapi.11st.co.kr/openapi}
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    token-url: https://oauth2.test/token
  jwt:
    secret: test-jwt-secret-at-least-32-bytes-long-for-hmac-sha256
    access-token-ttl-seconds: 900
    issuer: linkcart-test
    audience: linkcart-api-test
